[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gg-forge-kit"
version = "0.4.0"
description = "Utilidades compartidas por los bots de Discord de GG Forge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
ia = [
    "anthropic>=1.8,<2.0",
    "google-genai>=2.0,<3.0",
    "openai>=3.0,<4.0",
]
github = [
    "PyJWT[crypto]>=2.8,<3.0",
]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.3,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
